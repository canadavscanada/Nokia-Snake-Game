<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snake</title>
<style>
:root{--lcd:#a3b88a;--ink:#1f2b17;--body:#1d2023;--key:#2c3238}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--body);overflow:hidden;touch-action:none;font-family:"Courier New",monospace}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom))}
#phone{background:#2a4a6b;border-radius:22px;padding:12px 12px 14px;box-shadow:inset 0 0 0 2px #1a3350,0 6px 0 #11202f}
#bezel{background:#0f1a0b;border-radius:8px;padding:6px}
#lcd{background:var(--lcd);padding:6px;box-shadow:inset 0 0 14px rgba(0,0,0,.35)}
#hud{display:flex;justify-content:space-between;color:var(--ink);font-weight:bold;font-size:15px;padding:0 2px 4px;letter-spacing:1px}
canvas{display:block;image-rendering:pixelated;border:2px solid var(--ink)}
#pad{position:relative;width:min(62vw,250px);aspect-ratio:1;margin-bottom:6px}
#pad button{position:absolute;width:34%;height:34%;border:0;background:var(--key);color:#c9d3dc;font-size:26px;border-radius:12px;box-shadow:0 4px 0 #14181b}
#pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #14181b}
#u{left:33%;top:0}#d{left:33%;bottom:0}#l{left:0;top:33%}#r{right:0;top:33%}
</style></head>
<body><div id="app">
<div id="phone"><div id="bezel"><div id="lcd">
  <div id="hud"><span id="sc">0000</span><span id="hi">HI 0000</span></div>
  <canvas id="cv"></canvas>
</div></div></div>
<div id="pad"><button id="u">▲</button><button id="l">◀</button><button id="r">▶</button><button id="d">▼</button></div>
</div>
<script>
(function(){
var C=16,R=18,INK="#1f2b17",LCD="#a3b88a",GHOST="rgba(31,43,23,.12)";
var cv=document.getElementById("cv"),g=cv.getContext("2d");
var sc=document.getElementById("sc"),hiEl=document.getElementById("hi");
var cell=Math.floor(Math.min((innerWidth-70)/C,(innerHeight*0.5)/R));
cv.width=C*cell;cv.height=R*cell;
var snake,dir,queue,food,score,eaten,state="ready",timer,blink=true,hi=0;
try{hi=+localStorage.getItem("snakeHi")||0}catch(e){}
function pad(n){return ("0000"+n).slice(-4)}
function showHi(){hiEl.textContent="HI "+pad(hi)}
showHi();

var ac;
function beep(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 var o=ac.createOscillator(),v=ac.createGain();o.type="square";o.frequency.value=f;
 v.gain.value=.04;o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

function reset(){
 snake=[{x:5,y:9},{x:4,y:9},{x:3,y:9}];dir={x:1,y:0};queue=[];score=0;eaten=0;
 sc.textContent=pad(0);placeFood();
}
function placeFood(){
 var f;do{f={x:Math.floor(Math.random()*C),y:Math.floor(Math.random()*R)}}
 while(snake.some(function(s){return s.x==f.x&&s.y==f.y}));food=f;
}
function speed(){return Math.max(60,150-Math.floor(eaten/4)*10)}
function start(){reset();state="play";clearTimeout(timer);timer=setTimeout(tick,speed());draw()}
function tick(){
 if(state!="play")return;
 if(queue.length)dir=queue.shift();
 var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(h.x<0||h.y<0||h.x>=C||h.y>=R||snake.some(function(s){return s.x==h.x&&s.y==h.y})){return over()}
 snake.unshift(h);
 if(h.x==food.x&&h.y==food.y){eaten++;score+=7+Math.floor(eaten/4);sc.textContent=pad(score);beep(880,.08);placeFood()}
 else snake.pop();
 draw();timer=setTimeout(tick,speed());
}
function over(){
 state="over";beep(120,.35);
 if(score>hi){hi=score;try{localStorage.setItem("snakeHi",hi)}catch(e){}showHi()}
 draw();
}
window.pauseGame=function(){if(state=="play"){state="paused";draw()}};

function block(x,y,pad){var p=pad||0;
 g.fillStyle=INK;g.fillRect(x*cell+p,y*cell+p,cell-p*2,cell-p*2);
 g.fillStyle=LCD;var i=Math.max(2,Math.round(cell*.28));
 g.fillRect(x*cell+p+i,y*cell+p+i,cell-2*p-2*i,cell-2*p-2*i);
}
function solid(x,y){var p=Math.max(1,Math.floor(cell*.08));g.fillStyle=INK;g.fillRect(x*cell+p,y*cell+p,cell-2*p,cell-2*p)}
function text(t,y,sz){g.fillStyle=INK;g.font="bold "+sz+"px 'Courier New',monospace";g.textAlign="center";g.fillText(t,cv.width/2,y)}
function draw(){
 g.fillStyle=LCD;g.fillRect(0,0,cv.width,cv.height);
 if(state=="ready"&&!snake)reset();
 g.fillStyle=GHOST;
 for(var x=0;x<C;x++)for(var y=0;y<R;y++)g.fillRect(x*cell+cell*.35,y*cell+cell*.35,cell*.3,cell*.3);
 if(snake){
  snake.forEach(function(s,i){solid(s.x,s.y)});
  if(state!="play"||blink){g.fillStyle=INK;var fx=food.x*cell,fy=food.y*cell,m=cell/2;
   g.beginPath();g.moveTo(fx+m,fy+1);g.lineTo(fx+cell-1,fy+m);g.lineTo(fx+m,fy+cell-1);g.lineTo(fx+1,fy+m);g.closePath();g.fill()}
 }
 var big=Math.floor(cell*1.9),sm=Math.floor(cell*.8);
 if(state=="ready"){shade();text("SNAKE",cv.height*.4,big);text("tap to play",cv.height*.4+cell*2,sm);text("swipe or use keys",cv.height*.4+cell*3.2,sm)}
 if(state=="over"){shade();text("GAME OVER",cv.height*.38,Math.floor(cell*1.5));text("score "+pad(score),cv.height*.38+cell*2,sm*1.1);text("tap to retry",cv.height*.38+cell*3.4,sm)}
 if(state=="paused"){shade();text("PAUSED",cv.height*.42,big);text("tap to resume",cv.height*.42+cell*2,sm)}
}
function shade(){g.fillStyle="rgba(163,184,138,.82)";g.fillRect(cv.width*.06,cv.height*.22,cv.width*.88,cv.height*.38);
 g.strokeStyle=INK;g.lineWidth=2;g.strokeRect(cv.width*.06,cv.height*.22,cv.width*.88,cv.height*.38)}
setInterval(function(){blink=!blink;if(state=="play")draw()},220);

function turn(dx,dy){
 if(state!="play"){return}
 var last=queue.length?queue[queue.length-1]:dir;
 if((last.x==-dx&&last.y==-dy)||(last.x==dx&&last.y==dy))return;
 if(queue.length<2)queue.push({x:dx,y:dy});
}
function tap(){
 if(state=="ready"||state=="over")start();
 else if(state=="paused"){state="play";clearTimeout(timer);timer=setTimeout(tick,speed());draw()}
}
var M={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
Object.keys(M).forEach(function(k){
 document.getElementById(k).addEventListener("pointerdown",function(e){e.preventDefault();
  if(state!="play"){tap();return}turn(M[k][0],M[k][1])});
});
document.addEventListener("keydown",function(e){
 var m={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r",w:"u",s:"d",a:"l",d:"r"}[e.key];
 if(m){e.preventDefault();if(state!="play")tap();else turn(M[m][0],M[m][1])}
 else if(e.key==" "||e.key=="Enter"){if(state=="play")pauseGame();else tap()}
});
var sx,sy;
document.addEventListener("touchstart",function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",function(e){
 var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
 if(Math.abs(dx)<24&&Math.abs(dy)<24){if(e.target===cv||cv.contains(e.target)){if(state=="play")pauseGame();else tap()}return}
 if(state!="play"){return}
 if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
},{passive:true});
reset();draw();
})();
</script></body></html>
